<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090a1d"/><stop offset="0.62" stop-color="#14183b"/><stop offset="1" stop-color="#2b173a"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#51e4ff" stop-opacity="0.5"/><stop offset="1" stop-color="#51e4ff" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
