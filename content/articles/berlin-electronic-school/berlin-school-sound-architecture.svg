<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs></defs>
<style>
  .bg { fill:#070914; }
  .panel { fill:#0e1224; stroke:#273255; stroke-width:2; }
  .grid { stroke:#1b2442; stroke-width:1; }
  .cyan { fill:#51e4ff; }
  .amber { fill:#ffbd59; }
  .magenta { fill:#f064ff; }
  .violet { fill:#9277ff; }
  .white { fill:#f4f6ff; }
  .muted { fill:#a8b1cf; }
  .dark { fill:#070914; }
  .line-cyan { stroke:#51e4ff; stroke-width:5; fill:none; }
  .line-amber { stroke:#ffbd59; stroke-width:5; fill:none; }
  .line-magenta { stroke:#f064ff; stroke-width:5; fill:none; }
  .line-violet { stroke:#9277ff; stroke-width:5; fill:none; }
  .thin-cyan { stroke:#51e4ff; stroke-width:2; fill:none; }
  .thin-amber { stroke:#ffbd59; stroke-width:2; fill:none; }
  .thin-magenta { stroke:#f064ff; stroke-width:2; fill:none; }
  .title { font-family:DejaVu Sans,Arial,sans-serif; font-weight:700; font-size:62px; letter-spacing:1px; }
  .subtitle { font-family:DejaVu Sans,Arial,sans-serif; font-weight:400; font-size:27px; letter-spacing:2px; }
  .h2 { font-family:DejaVu Sans,Arial,sans-serif; font-weight:700; font-size:35px; }
  .body { font-family:DejaVu Sans,Arial,sans-serif; font-weight:400; font-size:24px; }
  .small { font-family:DejaVu Sans,Arial,sans-serif; font-weight:400; font-size:19px; }
  .tiny { font-family:DejaVu Sans,Arial,sans-serif; font-weight:600; font-size:16px; letter-spacing:1px; }
  .label { font-family:DejaVu Sans,Arial,sans-serif; font-weight:700; font-size:20px; letter-spacing:1px; }
</style>

<rect width="1600" height="900" class="bg"/>
<text x="75" y="90" class="h2 white">THE BERLIN SCHOOL SIGNAL PATH</text>
<text x="75" y="132" class="body muted">A repeating pattern is not the finished music. It is the engine that carries slow change.</text>
<rect x="70" y="310" width="240" height="190" rx="22" class="panel"/><rect x="70" y="310" width="240" height="12" rx="6" fill="#ffbd59"/><text x="190.0" y="385" text-anchor="middle" class="label white">CLOCK / PULSE</text><text x="190.0" y="425" text-anchor="middle" class="small muted">No kick required</text><rect x="360" y="310" width="270" height="190" rx="22" class="panel"/><rect x="360" y="310" width="270" height="12" rx="6" fill="#51e4ff"/><text x="495.0" y="385" text-anchor="middle" class="label white">STEP SEQUENCER</text><text x="495.0" y="425" text-anchor="middle" class="small muted">8–16 notes</text><rect x="680" y="310" width="250" height="190" rx="22" class="panel"/><rect x="680" y="310" width="250" height="12" rx="6" fill="#f064ff"/><text x="805.0" y="385" text-anchor="middle" class="label white">SYNTH VOICE</text><text x="805.0" y="425" text-anchor="middle" class="small muted">Oscillator + envelope</text><rect x="980" y="310" width="240" height="190" rx="22" class="panel"/><rect x="980" y="310" width="240" height="12" rx="6" fill="#9277ff"/><text x="1100.0" y="385" text-anchor="middle" class="label white">FILTER</text><text x="1100.0" y="425" text-anchor="middle" class="small muted">Movement in tone</text><rect x="1270" y="310" width="260" height="190" rx="22" class="panel"/><rect x="1270" y="310" width="260" height="12" rx="6" fill="#51e4ff"/><text x="1400.0" y="385" text-anchor="middle" class="label white">DELAY / SPACE</text><text x="1400.0" y="425" text-anchor="middle" class="small muted">Echo becomes rhythm</text>
<g class="line-amber"><circle cx="190" cy="455" r="28"/><line x1="190" y1="455" x2="190" y2="434"/><line x1="190" y1="455" x2="208" y2="465"/></g>
<g><rect x="390" y="425" width="17" height="34" rx="4" fill="#51e4ff"/><rect x="418" y="425" width="17" height="46" rx="4" fill="#273255"/><rect x="446" y="425" width="17" height="58" rx="4" fill="#51e4ff"/><rect x="474" y="425" width="17" height="70" rx="4" fill="#273255"/><rect x="502" y="425" width="17" height="34" rx="4" fill="#273255"/><rect x="530" y="425" width="17" height="46" rx="4" fill="#51e4ff"/><rect x="558" y="425" width="17" height="58" rx="4" fill="#273255"/><rect x="586" y="425" width="17" height="70" rx="4" fill="#51e4ff"/></g>
<path d="M720 458 C750 390,790 525,825 430 S895 520,910 435" class="line-magenta"/>
<path d="M1012 455 C1050 390,1100 390,1185 455 C1125 520,1060 520,1012 455 Z" class="line-violet"/>
<path d="M1305 450 C1360 390,1410 510,1460 450" class="line-cyan"/><path d="M1335 475 C1380 430,1420 520,1490 468" class="thin-cyan" opacity="0.55"/>
<line x1="310" y1="405" x2="346" y2="405" stroke="#ffbd59" stroke-width="5"/><polygon points="346,395 360,405 346,415" fill="#ffbd59"/><line x1="630" y1="405" x2="666" y2="405" stroke="#51e4ff" stroke-width="5"/><polygon points="666,395 680,405 666,415" fill="#51e4ff"/><line x1="930" y1="405" x2="966" y2="405" stroke="#f064ff" stroke-width="5"/><polygon points="966,395 980,405 966,415" fill="#f064ff"/><line x1="1220" y1="405" x2="1256" y2="405" stroke="#9277ff" stroke-width="5"/><polygon points="1256,395 1270,405 1256,415" fill="#9277ff"/>
<!-- modulation lanes -->
<rect x="180" y="625" width="1240" height="155" rx="25" class="panel"/>
<text x="230" y="675" class="label amber">SLOW MODULATION</text>
<text x="230" y="716" class="small muted">Transpose the sequence · open the filter · lengthen the decay · change one step · widen the stereo field</text>
<path d="M235 748 C390 690,520 805,690 742 S990 680,1160 746 S1320 790,1375 725" class="line-amber" opacity="0.85"/>
<text x="800" y="845" text-anchor="middle" class="body white">REPETITION + GRADUAL CHANGE = THE ILLUSION OF TRAVEL</text>
</svg>