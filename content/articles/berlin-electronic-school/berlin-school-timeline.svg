<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs></defs>
<style>
  .bg { fill:#070914; }
  .panel { fill:#0e1224; stroke:#273255; stroke-width:2; }
  .grid { stroke:#1b2442; stroke-width:1; }
  .cyan { fill:#51e4ff; }
  .amber { fill:#ffbd59; }
  .magenta { fill:#f064ff; }
  .violet { fill:#9277ff; }
  .white { fill:#f4f6ff; }
  .muted { fill:#a8b1cf; }
  .dark { fill:#070914; }
  .line-cyan { stroke:#51e4ff; stroke-width:5; fill:none; }
  .line-amber { stroke:#ffbd59; stroke-width:5; fill:none; }
  .line-magenta { stroke:#f064ff; stroke-width:5; fill:none; }
  .line-violet { stroke:#9277ff; stroke-width:5; fill:none; }
  .thin-cyan { stroke:#51e4ff; stroke-width:2; fill:none; }
  .thin-amber { stroke:#ffbd59; stroke-width:2; fill:none; }
  .thin-magenta { stroke:#f064ff; stroke-width:2; fill:none; }
  .title { font-family:DejaVu Sans,Arial,sans-serif; font-weight:700; font-size:62px; letter-spacing:1px; }
  .subtitle { font-family:DejaVu Sans,Arial,sans-serif; font-weight:400; font-size:27px; letter-spacing:2px; }
  .h2 { font-family:DejaVu Sans,Arial,sans-serif; font-weight:700; font-size:35px; }
  .body { font-family:DejaVu Sans,Arial,sans-serif; font-weight:400; font-size:24px; }
  .small { font-family:DejaVu Sans,Arial,sans-serif; font-weight:400; font-size:19px; }
  .tiny { font-family:DejaVu Sans,Arial,sans-serif; font-weight:600; font-size:16px; letter-spacing:1px; }
  .label { font-family:DejaVu Sans,Arial,sans-serif; font-weight:700; font-size:20px; letter-spacing:1px; }
</style>

<rect width="1600" height="900" class="bg"/>
<text x="80" y="95" class="h2 white">A CONSTELLATION, NOT A SINGLE FOUNDER</text>
<text x="80" y="138" class="body muted">Key rooms, people and records that shaped the Berlin School language</text>
<line x1="115" y1="450" x2="1490" y2="450" stroke="#354064" stroke-width="6"/>
<line x1="170" y1="450" x2="170" y2="390" stroke="#51e4ff" stroke-width="3"/><circle cx="170" cy="450" r="13" fill="#51e4ff"/><rect x="65" y="220" width="210" height="142" rx="16" class="panel"/><text x="170" y="254" text-anchor="middle" class="tiny" fill="#51e4ff">1967</text><text x="170" y="287" text-anchor="middle" class="label white">TANGERINE DREAM</text><text x="170" y="319" text-anchor="middle" class="small muted">Edgar Froese forms the</text><text x="170" y="341" text-anchor="middle" class="small muted">group</text><line x1="350" y1="450" x2="350" y2="510" stroke="#ffbd59" stroke-width="3"/><circle cx="350" cy="450" r="13" fill="#ffbd59"/><rect x="245" y="610" width="210" height="142" rx="16" class="panel"/><text x="350" y="644" text-anchor="middle" class="tiny" fill="#ffbd59">1968</text><text x="350" y="677" text-anchor="middle" class="label white">ZODIAK + EBS</text><text x="350" y="709" text-anchor="middle" class="small muted">Experimental rooms become</text><text x="350" y="731" text-anchor="middle" class="small muted">laboratories</text><line x1="545" y1="450" x2="545" y2="390" stroke="#f064ff" stroke-width="3"/><circle cx="545" cy="450" r="13" fill="#f064ff"/><rect x="440" y="235" width="210" height="142" rx="16" class="panel"/><text x="545" y="269" text-anchor="middle" class="tiny" fill="#f064ff">1970–72</text><text x="545" y="302" text-anchor="middle" class="label white">SCHULZE GOES SOLO</text><text x="545" y="334" text-anchor="middle" class="small muted">Ash Ra Tempel → Irrlicht</text><line x1="735" y1="450" x2="735" y2="510" stroke="#9277ff" stroke-width="3"/><circle cx="735" cy="450" r="13" fill="#9277ff"/><rect x="630" y="620" width="210" height="142" rx="16" class="panel"/><text x="735" y="654" text-anchor="middle" class="tiny" fill="#9277ff">1974</text><text x="735" y="687" text-anchor="middle" class="label white">PHAEDRA</text><text x="735" y="719" text-anchor="middle" class="small muted">Sequencer instability</text><text x="735" y="741" text-anchor="middle" class="small muted">becomes form</text><line x1="930" y1="450" x2="930" y2="390" stroke="#51e4ff" stroke-width="3"/><circle cx="930" cy="450" r="13" fill="#51e4ff"/><rect x="825" y="220" width="210" height="142" rx="16" class="panel"/><text x="930" y="254" text-anchor="middle" class="tiny" fill="#51e4ff">1975–76</text><text x="930" y="287" text-anchor="middle" class="label white">TIMEWIND / MOONDOWN</text><text x="930" y="319" text-anchor="middle" class="small muted">Klaus Schulze stretches</text><text x="930" y="341" text-anchor="middle" class="small muted">time</text><line x1="1135" y1="450" x2="1135" y2="510" stroke="#ffbd59" stroke-width="3"/><circle cx="1135" cy="450" r="13" fill="#ffbd59"/><rect x="1030" y="620" width="210" height="142" rx="16" class="panel"/><text x="1135" y="654" text-anchor="middle" class="tiny" fill="#ffbd59">1976</text><text x="1135" y="687" text-anchor="middle" class="label white">NEW AGE OF EARTH</text><text x="1135" y="719" text-anchor="middle" class="small muted">Göttsching turns repetition</text><text x="1135" y="741" text-anchor="middle" class="small muted">luminous</text><line x1="1355" y1="450" x2="1355" y2="390" stroke="#f064ff" stroke-width="3"/><circle cx="1355" cy="450" r="13" fill="#f064ff"/><rect x="1250" y="235" width="210" height="142" rx="16" class="panel"/><text x="1355" y="269" text-anchor="middle" class="tiny" fill="#f064ff">1981 / 84</text><text x="1355" y="302" text-anchor="middle" class="label white">E2–E4</text><text x="1355" y="334" text-anchor="middle" class="small muted">A bridge toward club</text><text x="1355" y="356" text-anchor="middle" class="small muted">minimalism</text>
<rect x="80" y="805" width="1440" height="48" rx="24" fill="#111832"/>
<text x="800" y="837" text-anchor="middle" class="small muted">The style was built collectively: Froese, Schulze, Göttsching, Franke, Baumann, Kessler, Schnitzler and a wider experimental scene.</text>
</svg>