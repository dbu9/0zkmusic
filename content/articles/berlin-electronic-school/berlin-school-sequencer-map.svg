<text x="800" y="782" text-anchor="middle" class="small muted">A Berlin School sequence can stay harmonically simple while automation, transposition and subtraction create the drama.</text>
<text x="800" y="811" text-anchor="middle" class="small white">The listener hears a machine repeating — and a landscape changing around it.</text>
