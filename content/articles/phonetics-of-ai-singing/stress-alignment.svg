<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Linguistic stress and musical stress</title>
  <desc id="desc">A two-row comparison showing natural word stresses aligned and misaligned with strong beats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101c"/>
      <stop offset="1" stop-color="#171022"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="72" y="78" fill="#f5fbff" font-size="38" font-weight="700">WHEN THE WORD AND THE BEAT AGREE</text>
    <text x="72" y="118" fill="#93a7b7" font-size="20">Prominent syllables are easier to hear when musical weight arrives at the same place.</text>

    <text x="72" y="204" fill="#62e8d5" font-size="21" font-weight="700" letter-spacing="2">ALIGNED</text>
    <g transform="translate(72 238)">
      <line x1="0" y1="122" x2="1230" y2="122" stroke="#293a4d" stroke-width="3"/>
      <g fill="#1a2a3d" stroke="#3c566c" stroke-width="2">
        <circle cx="95" cy="122" r="34"/><circle cx="285" cy="122" r="34"/><circle cx="475" cy="122" r="34"/>
        <circle cx="665" cy="122" r="34"/><circle cx="855" cy="122" r="34"/><circle cx="1045" cy="122" r="34"/>
      </g>
      <g fill="#58ead7" filter="url(#glow)">
        <circle cx="95" cy="122" r="14"/><circle cx="665" cy="122" r="14"/>
      </g>
      <g fill="#dff9ff" font-size="28" text-anchor="middle">
        <text x="95" y="58" font-weight="800">IN</text>
        <text x="285" y="58">side</text>
        <text x="475" y="58">your</text>
        <text x="665" y="58" font-weight="800">GRAV</text>
        <text x="855" y="58">i</text>
        <text x="1045" y="58">ty</text>
      </g>
      <g fill="#7893a5" font-size="17" text-anchor="middle">
        <text x="95" y="186">STRONG</text><text x="285" y="186">weak</text><text x="475" y="186">weak</text>
        <text x="665" y="186">STRONG</text><text x="855" y="186">weak</text><text x="1045" y="186">weak</text>
      </g>
    </g>

    <text x="72" y="512" fill="#ff668f" font-size="21" font-weight="700" letter-spacing="2">MISALIGNED</text>
    <g transform="translate(72 546)">
      <line x1="0" y1="80" x2="1230" y2="80" stroke="#3f2938" stroke-width="3"/>
      <g fill="#251c2b" stroke="#644052" stroke-width="2">
        <circle cx="95" cy="80" r="34"/><circle cx="285" cy="80" r="34"/><circle cx="475" cy="80" r="34"/>
        <circle cx="665" cy="80" r="34"/><circle cx="855" cy="80" r="34"/><circle cx="1045" cy="80" r="34"/>
      </g>
      <g fill="#ff5d88" filter="url(#glow)">
        <circle cx="285" cy="80" r="14"/><circle cx="855" cy="80" r="14"/>
      </g>
      <g fill="#e9dce7" font-size="28" text-anchor="middle">
        <text x="95" y="22" font-weight="800">IN</text>
        <text x="285" y="22">side</text>
        <text x="475" y="22">your</text>
        <text x="665" y="22" font-weight="800">GRAV</text>
        <text x="855" y="22">i</text>
        <text x="1045" y="22">ty</text>
      </g>
      <g fill="#9f768a" font-size="17" text-anchor="middle">
        <text x="95" y="144">strong word</text><text x="285" y="144">STRONG BEAT</text><text x="475" y="144">weak word</text>
        <text x="665" y="144">strong word</text><text x="855" y="144">STRONG BEAT</text><text x="1045" y="144">weak syllable</text>
      </g>
    </g>
  </g>
</svg>
