{{ define "main" }}
  <header class="page-header">
    {{ partial "breadcrumbs.html" . }}
    <p class="eyebrow">Browse</p>
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="page-intro prose dark:prose-invert">{{ . }}</div>{{ end }}
  </header>
  {{ $taxonomy := index site.Taxonomies (.Data.Plural | default (lower .Title)) }}
  <section class="term-cloud term-cloud-large">
    {{ range $taxonomy.Alphabetical }}
      <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span>{{ .Count }}</span></a>
    {{ end }}
  </section>
{{ end }}
